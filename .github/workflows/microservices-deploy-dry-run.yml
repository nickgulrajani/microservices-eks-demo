        echo "  🐳 order-service:v1.0.0 → ECR"
        echo "  🐳 notification-service:v1.0.0 → ECR"
        echo "✅ All images pushed to ECR!"
        echo ""
        echo "Phase 3: Kubernetes Deployment"
        echo "------------------------------"
        echo "⏳ Applying namespace configuration..."
        echo "⏳ Deploying microservices..."
        echo "  ☸️ api-gateway: 2/2 pods ready"
        echo "  ☸️ user-service: 2/2 pods ready"
        echo "  ☸️ order-service: 2/2 pods ready"
